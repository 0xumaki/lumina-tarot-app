<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lumina — Offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    background: #000; color: #E8EBE9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-weight: 300;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    text-align: center;
  }
  .wrap { max-width: 340px; }
  .orb {
    width: 88px; height: 88px; margin: 0 auto 20px;
    border-radius: 9999px;
    background: radial-gradient(circle at 50% 35%, rgba(197,168,124,0.5), rgba(197,168,124,0.05) 70%, transparent);
    border: 1px solid rgba(197,168,124,0.3);
    box-shadow: 0 0 40px rgba(197,168,124,0.2), inset 0 0 20px rgba(197,168,124,0.15);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.05);opacity:1} }
  h1 { font-size: 22px; font-weight: 300; letter-spacing: -0.02em; margin: 0 0 8px; }
  p { color: #7A8680; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
  a { color: #C5A87C; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="orb"></div>
    <h1>You are offline</h1>
    <p>The stars are still aligned. Reconnect to continue your reading, ritual, or resonance.</p>
    <a href="/">Try again</a>
  </div>
</body>
</html>
